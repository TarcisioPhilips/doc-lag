name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Stable required-status name (does not change with the Node matrix).
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Require Build and Test success
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "Build and Test failed: ${{ needs.build-and-test.result }}"
            exit 1
          fi

  # Dogfood the published-style composite action on every PR (advisory).
  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run doc-lag action
        id: doc-lag
        continue-on-error: true
        uses: ./
        with:
          fail-on: none
          comment: true
          sarif: true

      - name: Show action outputs
        if: always()
        run: |
          echo "findings-count=${{ steps.doc-lag.outputs.findings-count }}"
          echo "confirmed-count=${{ steps.doc-lag.outputs.confirmed-count }}"
          echo "report-path=${{ steps.doc-lag.outputs.report-path }}"
          echo "sarif-path=${{ steps.doc-lag.outputs.sarif-path }}"
