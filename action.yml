name: doc-lag
description: Catch docs made stale by a pull request. Evidence-backed findings as a sticky PR comment.
author: TarcisioPhilips
branding:
  icon: file-text
  color: blue

inputs:
  fail-on:
    description: >
      When to fail the step. `confirmed` fails if any confirmed finding exists;
      `none` always exits 0 (advisory).
    required: false
    default: confirmed
  comment:
    description: >
      Post or update a single sticky pull request comment. When the token cannot
      write comments (typical for fork PRs), the action continues with the job
      summary only and does not fail for that reason.
    required: false
    default: "true"
  working-directory:
    description: Repository subdirectory to scan (relative to github.workspace).
    required: false
    default: "."
  sarif:
    description: >
      When true, write a SARIF 2.1.0 report (path available as the sarif-path
      output) for optional upload with github/codeql-action/upload-sarif.
    required: false
    default: "false"
  base:
    description: >
      Optional base git ref/sha. Defaults to pull_request.base.sha on
      pull_request events.
    required: false
    default: ""
  head:
    description: >
      Optional head git ref/sha. Defaults to pull_request.head.sha on
      pull_request events.
    required: false
    default: ""
  rank:
    description: >
      Optional semantic ranking. `none` (default) keeps the scan offline and
      deterministic. `jev` reorders needs-review/unknown findings via TypeSafe
      AI Jev; requires secret TYPESAFE_API_KEY. Sends PR diff summaries and
      documentation excerpts to a third-party API. Never changes finding
      statuses — ordering/evidence only.
    required: false
    default: none
  config:
    description: >
      Optional path to doc-lag.config.json (relative to working-directory).
      When empty, auto-discovers doc-lag.config.json or .doc-lag.json.
    required: false
    default: ""
  docs-include:
    description: >
      Optional documentation include globs (comma- or newline-separated).
      When set, replaces built-in/config include patterns.
    required: false
    default: ""
  docs-exclude:
    description: >
      Optional documentation exclude globs (comma- or newline-separated).
      When set, replaces built-in/config exclude patterns.
    required: false
    default: ""

outputs:
  findings-count:
    description: Total number of findings
    value: ${{ steps.run.outputs.findings-count }}
  confirmed-count:
    description: Number of confirmed findings
    value: ${{ steps.run.outputs.confirmed-count }}
  needs-review-count:
    description: Number of needs-review findings
    value: ${{ steps.run.outputs.needs-review-count }}
  report-path:
    description: Absolute path to the JSON report written by the action
    value: ${{ steps.run.outputs.report-path }}
  sarif-path:
    description: Absolute path to the SARIF report (empty when sarif input is false)
    value: ${{ steps.run.outputs.sarif-path }}

runs:
  using: composite
  steps:
    # Packaging choice: composite + build-from-source (no committed action dist).
    # Reproducible via package-lock.json; consumers pin a git tag/SHA.
    # No npm cache here: with `uses: ./`, github.action_path can contain a
    # trailing "/./" and setup-node rejects cache-dependency-path with ".".
    # The lockfile is small; a cold npm ci is acceptable for correctness.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install doc-lag
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts

    - name: Build doc-lag
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build

    - name: Run doc-lag
      id: run
      shell: bash
      # Scan the consumer workspace; never execute commands found in docs.
      # Network: GitHub API for sticky comments; TypeSafe AI only when rank=jev
      # (requires TYPESAFE_API_KEY secret in the workflow env).
      env:
        DOC_LAG_FAIL_ON: ${{ inputs.fail-on }}
        DOC_LAG_COMMENT: ${{ inputs.comment }}
        DOC_LAG_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DOC_LAG_SARIF: ${{ inputs.sarif }}
        DOC_LAG_RANK: ${{ inputs.rank }}
        DOC_LAG_BASE: ${{ inputs.base }}
        DOC_LAG_HEAD: ${{ inputs.head }}
        DOC_LAG_CONFIG: ${{ inputs.config }}
        DOC_LAG_DOCS_INCLUDE: ${{ inputs.docs-include }}
        DOC_LAG_DOCS_EXCLUDE: ${{ inputs.docs-exclude }}
        GITHUB_TOKEN: ${{ github.token }}
        TYPESAFE_API_KEY: ${{ env.TYPESAFE_API_KEY }}
      run: node "${{ github.action_path }}/dist/action/main.js"
